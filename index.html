<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic90s</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/background.css" />
  <link rel="stylesheet" href="/styles/topbar.css" />
  <link rel="stylesheet" href="/styles/player.css" />
</head>

<body>
  <div id="app">
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-image"></div>
      <div class="bg-decoy"></div>
      <div class="bg-vignette"></div>
    </div>

    <div class="title-mark title-mark--upper" id="titleMarkUpper" aria-hidden="true">
      <div class="title-mark-image"></div>
      <div class="title-mark-decoy"></div>
    </div>
    <div class="title-mark title-mark--lower" id="titleMarkLower" aria-hidden="true">
      <div class="title-mark-image"></div>
      <div class="title-mark-decoy"></div>
    </div>

    <div class="top-bar">

      <!-- left corner of top bar-->
      <div class="top-bar-zone top-bar-zone--left">
        <div class="visit-badge" tabindex="0">
          <svg class="visit-eye-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5a5 5 0 0 1 5-5a5 5 0 0 1 5 5a5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5"></path>
          </svg>
          <span class="visit-number" id="visitCount">--</span>
          <div class="top-bar-tooltip top-bar-tooltip--down">
            <span>Total Visits</span>
          </div>
        </div>
      </div>
      

      <!-- center of top bar -->
      <div class="top-bar-zone top-bar-zone--center">
        <div class="listener-badge">
          <div class="listener-emoji-wrap">
            <img src="/emoji-music.webp" class="listener-emoji" alt="" />
            <div class="listener-decoy" aria-hidden="true"></div>
          </div>
          <span class="listener-number" id="listenerNumber">7</span>
          <span class="listener-label">listening</span>
        </div>
      </div>


      <!-- right corner of topbar -->
      <div class="top-bar-zone top-bar-zone--right">

        <!-- github -->

        <a class="top-bar-icon" href="https://github.com/thunderzz12/Classic90s" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .28.18.61.69.5A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
          <span class="top-bar-icon-arrow" aria-hidden="true">↗</span>
          <div class="top-bar-tooltip top-bar-tooltip--pink">
            <img src="/emoji.png" alt="" />
            <span>would mean a lot if you starred it!</span>
          </div>
        </a>

        <!-- ytm -->

        <a class="top-bar-icon" href="https://music.youtube.com/playlist?list=PLASDflY7MWjE" target="_blank" rel="noopener noreferrer" aria-label="Open playlist on YouTube Music">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 16.5c-3.58 0-6.5-2.92-6.5-6.5S8.42 5.5 12 5.5s6.5 2.92 6.5 6.5-2.92 6.5-6.5 6.5zM9.5 8.5v7l6-3.5-6-3.5z"/></svg>
          <span class="top-bar-icon-arrow" aria-hidden="true">↗</span>
          <div class="top-bar-tooltip">
            <span>Listen on YouTube Music</span>
          </div>
        </a>
      </div>
    </div>

    <div id="youtube-player" class="yt-mount" aria-hidden="true"></div>

    <!-- player -->

    <div class="player-pill" id="playerPill">
      <div class="player-art-wrap">
        <img class="player-art" id="playerArt" alt="" width="56" height="56" />
        <div class="player-art-hole" aria-hidden="true"></div>
      </div>

      <div class="player-body">
        <div class="player-meta">
          <p class="player-title" id="playerTitle">Loading&hellip;</p>
          <p class="player-artist" id="playerArtist">&nbsp;</p>
        </div>

        <div class="player-progress" id="playerProgress">
          <div class="player-progress-fill" id="playerProgressFill">
            <div class="player-progress-handle"></div>
          </div>
        </div>

        <div class="player-time">
          <span id="playerElapsed">0:00</span>
          <span class="player-time-sep">/</span>
          <span id="playerDuration">0:00</span>
        </div>
      </div>

      <div class="player-controls">

        <!-- shuffle btn and shuffle hint wrapped together -->

        <div class="shuffle-btn-wrap">
          <button class="ctrl-btn ctrl-btn--toggle" id="btnShuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
            </svg>
            <span class="ctrl-btn-dot" aria-hidden="true"></span>
            <div class="icon-tooltip icon-tooltip--up">
              <span id="shuffleTooltipText">Enable shuffle</span>
            </div>
          </button>
 
          
          <div class="shuffle-hint" id="shuffleHint">
            <span>Tired of the same order? Try shuffle</span>
            <div class="shuffle-hint-actions">
              <button class="shuffle-hint-ok" id="shuffleHintOk">OK</button>
              <button class="shuffle-hint-never" id="shuffleHintNever">Don't show again</button>
            </div>
          </div>
        </div>

        <!-- previous btn -->

        <button class="ctrl-btn" id="btnPrev" aria-label="Previous track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>

        <!-- play/pause btn -->

        <button class="ctrl-btn ctrl-btn--main" id="btnPlay" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>

        <!-- next btn -->

        <button class="ctrl-btn" id="btnNext" aria-label="Next track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
        </button>

        <!-- repeat btn -->

        <button class="ctrl-btn ctrl-btn--toggle" id="btnRepeat" aria-label="Repeat">
          <span class="ctrl-icon-slot" id="repeatIconSlot">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 1 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75z"/></svg>
          </span>
          <span class="ctrl-btn-dot" aria-hidden="true"></span>
          <div class="icon-tooltip icon-tooltip--up">
            <span id="repeatTooltipText">Enable repeat playlist</span>
          </div>
        </button> 

      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
